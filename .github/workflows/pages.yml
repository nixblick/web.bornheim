# Veröffentlicht die Webseite und das Spiel auf GitHub Pages.
# Hochgeladen werden nur die Dateien, die der Browser braucht (keine Werkzeuge, Tests oder Notizen).
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Startcheck (benutzte, aber nirgends definierte Namen)
        # Anlass 12.11.2026: „berger is not defined“ nach einem Commit, das Spiel startete nicht. Bricht das Ausrollen ab.
        run: |
          npm i --no-save --no-package-lock eslint@9.15.0 globals@15.12.0
          npx eslint --config eslint.config.mjs *.js
      - name: Typprüfung (unbekannte Eigenschaften am Kontext X und an Kachel-Daten, #119)
        # jsconfig.json + types.d.ts; noch nicht geprüft: game.js, feedback.js, sw.js, touch.js (Liste im Ticket #119)
        run: npx -y -p typescript@5 tsc -p jsconfig.json
      - name: Spieldateien zusammenstellen
        run: |
          mkdir _site
          cp index.html play.html credits.html impressum.html manifest.webmanifest _site/
          cp *.css _site/  # Stylesheets im Wurzelverzeichnis (menu-neu.css, ui-sunset.css): fehlten live, 404 (13.11.2026)
          cp *.js _site/   # alle Spielmodule im Wurzelverzeichnis (tools/ bleibt draußen); eine feste Liste hat story3.js vergessen und die Seite hing bei „Lade Stadt“
          V="${GITHUB_SHA::7}"
          sed -i "s/game\.js[^']*/game.js?v=$V/" _site/play.html
          sed -i -E "s/from '\.\/([a-z0-9_-]+\.js)'/from '.\/\1?v=$V'/g" _site/*.js
          # Service Worker: Cache fuer Programm, Bilder und CSS je Deploy neu benennen (alter wird beim Aktivieren geloescht),
          # sonst bekaemen Spieler geaenderte Bilder/CSS nie und der Cache wuechse mit jeder Version (12.11.2026)
          sed -i "s/bornheim-static-v2/bornheim-static-$V/" _site/sw.js
          cp -r assets vendor _site/
          mkdir _site/data && cp -r data/tiles data/dem _site/data/ && cp data/*.json _site/data/   # alle JSON im Datenordner (belag.json und vokabeln.json fehlten live); Rohdaten *.osm.json sind nicht eingecheckt
          touch _site/.nojekyll
          # Wächter: jede lokal verlinkte Datei (href/src in HTML, fetch('data/…') und import './…' in JS) muss im Paket liegen
          fehlt=0
          for f in $( { grep -ohE "(href|src)=\"[^\"#:]+\"" _site/*.html | sed -E 's/^[a-z]+="//; s/"$//'; grep -ohE "fetch\('data/[^'\$]+'\)" _site/*.js | sed -E "s/^fetch\('//; s/'\)$//"; grep -ohE "from '\./[^']+'" _site/*.js | sed -E "s/^from '\.\///; s/'$//"; } | sed -E 's/\?.*$//' | sort -u ); do
            [ -e "_site/$f" ] || { echo "FEHLT im Paket: $f"; fehlt=1; }
          done
          [ "$fehlt" = 0 ]
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  # Rundgang nach jedem Deploy (12.11.2026): echtes Spiel im Chrome des Runners starten, „Rein da“, Fehler sammeln.
  # Läuft auf GitHub, nicht auf Andrés Notebook (CLAUDE.md: lokale Browser-Tests nur nachts).
  rundgang:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spiel starten und auf Fehler prüfen
        run: |
          sleep 60
          mkdir -p rg && node tools/rundgang.mjs rg "$(command -v google-chrome)" start
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rundgang
          path: rg/*.png
