# Spieltest auf GitHub statt auf dem Notebook (André 13.11.2026): Headless-Chrome mit SwiftShader fährt
# tools/probe.mjs mit einer oder mehreren Probendateien. Ergebnis: stand.txt im Log, Bilder als Artefakt.
# Start von Hand (Zweig und Proben wählbar) oder automatisch bei jedem PR nach main.
name: Spieltest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Zweig oder Commit
        default: main
      proben:
        description: Probendateien unter tools/proben/, Leerzeichen-getrennt (leer = alle)
        default: ''
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typen:
    # Startcheck und Typprüfung schon im PR, nicht erst beim Ausrollen (#119); gleiche Befehle wie in pages.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
      - name: Startcheck (Syntaxfehler und nirgends definierte Namen, auch in game.js)
        run: |
          npm i --no-save --no-package-lock eslint@9.15.0 globals@15.12.0
          npx eslint --config eslint.config.mjs *.js
      - run: npx -y -p typescript@5 tsc -p jsconfig.json

  liste:
    runs-on: ubuntu-latest
    outputs:
      proben: ${{ steps.l.outputs.proben }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
      - name: Proben aus dem Stand des Workflows (main oder --ref), Spielcode aus ref
        run: git fetch -q --depth 1 origin "$GITHUB_SHA" && git rm -rq --ignore-unmatch tools/proben && git checkout FETCH_HEAD -- tools/proben
      - id: l
        env:
          WAHL: ${{ inputs.proben }}
        run: |
          if [ -n "$WAHL" ]; then set -- $WAHL; else set -- $(cd tools/proben && ls *.json); fi
          printf '%s\n' "$@" | sed 's/\.json$//' | jq -R . | jq -sc . | sed 's/^/proben=/' >> "$GITHUB_OUTPUT"

  probe:
    needs: [liste, typen]
    # Im PR starten die teuren Chrome-Proben nur, wenn Startcheck und Typprüfung grün sind; Handstarts (alter Stand) bleiben möglich
    if: ${{ !cancelled() && needs.liste.result == 'success' && (github.event_name != 'pull_request' || needs.typen.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        probe: ${{ fromJson(needs.liste.outputs.proben) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Proben und Werkzeug aus dem Stand des Workflows (main oder --ref), Spielcode aus ref
        run: git fetch -q --depth 1 origin "$GITHUB_SHA" && git rm -rq --ignore-unmatch tools/proben && git checkout FETCH_HEAD -- tools/probe.mjs tools/proben
      - name: Probe ${{ matrix.probe }}
        # Jeder rote Lauf schickt André eine Mail (14.11.2026: „bitte keine failed ereignisse mehr“). Deshalb: einmal wiederholen
        # (Zeitschwankungen des Testrechners), und Proben aus tools/proben/wackelig.txt zählen auch nach zwei roten Läufen nicht.
        run: |
          P="${{ matrix.probe }}"; C="$(command -v google-chrome)"
          node tools/probe.mjs "tools/proben/$P.json" "out/$P" "$C" && exit 0
          echo "::notice::Probe $P: erster Lauf rot, zweiter Versuch"; rm -rf "out/$P-1"; mv "out/$P" "out/$P-1"
          node tools/probe.mjs "tools/proben/$P.json" "out/$P" "$C" && exit 0
          if grep -qx "$P" tools/proben/wackelig.txt 2>/dev/null; then echo "::warning::Probe $P ist als wackelig geführt und war zweimal rot: zählt nicht"; exit 0; fi
          exit 1
      - name: Stand
        if: always()
        run: cat "out/${{ matrix.probe }}/stand.txt" || true
      - name: Zusammenfassung ins Job-Summary
        if: always()
        run: |
          f="out/${{ matrix.probe }}/ergebnis.json"
          { echo "### Probe ${{ matrix.probe }}"
            if [ -f "$f" ]; then jq -r '"\(.passed) ok, \(.failed|length) rot, \(.harmlos) harmlose Meldungen gefiltert"' "$f"
              jq -r '.failed[] | "- **\(.step)**: \(.error|tostring|.[0:300]) `\(.pos|tostring)`"' "$f"
              echo '```json'; jq -c '.letzte // empty' "$f"; echo '```'
            else echo "kein ergebnis.json"; fi; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.probe }}
          path: |
            out/${{ matrix.probe }}/*.jpg
            out/${{ matrix.probe }}/*.txt
            out/${{ matrix.probe }}/ergebnis.json
          retention-days: 14
